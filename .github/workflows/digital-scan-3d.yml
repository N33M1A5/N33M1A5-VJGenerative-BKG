name: Build Digital Scan 3D (Windows x64)
on:
  workflow_dispatch:
  push:
    paths:
      - "digital-scan-3d/**"
      - ".github/workflows/digital-scan-3d.yml"
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install GLEW dependency
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:RUNNER_TEMP/vcpkg
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install glew:x64-windows
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure
        shell: pwsh
        run: cmake -S digital-scan-3d -B digital-scan-3d/build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build digital-scan-3d/build --config Release
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: N33M1A5-DigitalScan3D-Windows-x64
          path: digital-scan-3d/build/Release/*.dll
          if-no-files-found: error
