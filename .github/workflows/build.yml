name: Build N33 VJ Unified V1.3

on:
  push:
    branches: [main, 'fix/v1-3-unified-engine-palette']
    paths:
      - 'VJGenerative.cpp'
      - 'shaders.h'
      - 'shaders_expansion.h'
      - 'tools/validate_unified.py'
      - 'build/windows/VJGenerativeV1.vcxproj'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original shader and 24 shared engine options
        run: python3 tools/validate_unified.py
      - name: Check GLSL syntax against OpenGL 4.10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator -S vert glsl-validation/legacy.vert
          glslangValidator -S frag glsl-validation/legacy.frag
          glslangValidator -S frag glsl-validation/legacy_palette.frag
          glslangValidator -S vert glsl-validation/expanded.vert
          glslangValidator -S frag glsl-validation/expanded.frag
  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout N33M1A5 source
        uses: actions/checkout@v4

      - name: Checkout official Resolume FFGL SDK
        uses: actions/checkout@v4
        with:
          repository: resolume/ffgl
          ref: master
          path: ffgl

      - name: Install standalone plugin into SDK
        shell: pwsh
        run: |
          $target = 'ffgl/source/plugins/VJGenerativeV1'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item VJGenerative.cpp "$target/VJGenerative.cpp" -Force
          Copy-Item shaders.h "$target/shaders.h" -Force
          Copy-Item shaders_expansion.h "$target/shaders_expansion.h" -Force
          Copy-Item build/windows/VJGenerativeV1.vcxproj ffgl/build/windows/VJGenerativeV1.vcxproj -Force
          if (!(Test-Path 'ffgl/deps/glew.props')) { throw 'Official SDK GLEW props missing.' }
          if (!(Test-Path 'ffgl/build/windows/FFGLPlugins.def')) { throw 'Official SDK module exports missing.' }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build FFGL DLL (Release x64)
        shell: pwsh
        run: |
          msbuild 'ffgl/build/windows/VJGenerativeV1.vcxproj' /m /t:Build /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild failed.' }

      - name: Validate and stage DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem 'ffgl' -Filter 'VJGenerativeUnified.dll' -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'Expected VJGenerativeUnified.dll was not created.' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact/VJGenerativeUnified.dll -Force
          Write-Host "DLL: $($dll.FullName)"
          Write-Host "Bytes: $($dll.Length)"
          Get-FileHash artifact/VJGenerativeUnified.dll -Algorithm SHA256 | Format-List

      - name: Upload Windows x64 DLL
        uses: actions/upload-artifact@v4
        with:
          name: N33-VJ-Unified-V1.3-Windows-x64
          path: artifact/VJGenerativeUnified.dll
          if-no-files-found: error
